<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>神旅帳 - オフライン</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: #f6f1e6; color: #2b2b2b;
        font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
        padding: 24px; text-align: center;
      }
      .card { max-width: 22rem; }
      h1 { font-size: 1.15rem; letter-spacing: .12em; margin: 0 0 .75rem; }
      p { font-size: .84rem; line-height: 1.9; color: #6b6257; margin: 0 0 1.5rem; }
      button {
        border: 1px solid #a8322a; background: #a8322a; color: #fff;
        padding: .7rem 1.6rem; border-radius: 999px; font-size: .84rem;
        letter-spacing: .1em; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>オフラインです</h1>
      <p>通信環境をご確認ください。<br />保存済みの参拝記録・御朱印はそのままご覧いただけます。</p>
      <button onclick="location.reload()">再読み込み</button>
    </div>
  </body>
</html>
