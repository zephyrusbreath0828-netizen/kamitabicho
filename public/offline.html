<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f3ea" />
<title>神旅帳 — オフライン</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f7f3ea; color:#2f2b26;
         font-family:"Hiragino Mincho ProN","Yu Mincho",serif; padding:24px; }
  .card { max-width:420px; width:100%; background:#fffdf8; border:1px solid #e4dcce; border-radius:14px;
          padding:28px 22px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .mark { width:52px; height:52px; margin:0 auto 14px; border-radius:50%; border:2px solid #a8894f;
          color:#a8894f; display:grid; place-items:center; font-size:20px; }
  h1 { font-size:1.1rem; margin:0 0 10px; letter-spacing:.04em; }
  p { font-size:.86rem; line-height:1.8; color:#6b6259; margin:0 0 18px; }
  button { width:100%; padding:12px; border-radius:10px; border:1px solid #a8894f; background:#a8894f;
           color:#fff; font-size:.9rem; font-family:inherit; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden>社</div>
    <h1>オフラインです</h1>
    <p>通信が届かない場所にいます。<br />保存済みの地域データは引き続き閲覧できます。<br />通信が復帰すると自動で同期します。</p>
    <button onclick="location.reload()">再読み込みする</button>
  </div>
</body>
</html>
